<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CORS Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Test CORS Fix</h1>
    
    <div class="test-section info">
        <h3>📋 Environment Info</h3>
        <p><strong>Current URL:</strong> <span id="current-url"></span></p>
        <p><strong>Is Localhost:</strong> <span id="is-localhost"></span></p>
        <p><strong>API Endpoint:</strong> <span id="api-endpoint"></span></p>
    </div>

    <div class="test-section">
        <h3>🔗 Test API Connection</h3>
        <button onclick="testDirectAPI()">Test Direct API</button>
        <button onclick="testProxyAPI()">Test Proxy API</button>
        <button onclick="testAutoAPI()">Test Auto Detection</button>
        <div id="test-results"></div>
    </div>

    <script>
        // Display environment info
        document.getElementById('current-url').textContent = window.location.href;
        
        const isLocalhost = window.location.hostname === 'localhost' || 
                           window.location.hostname === '127.0.0.1' ||
                           window.location.hostname.includes('localhost');
        
        document.getElementById('is-localhost').textContent = isLocalhost;
        
        const apiUrl = isLocalhost 
            ? '/.netlify/functions/khainiem-proxy'
            : 'https://admin.wikiw.vn/wp-json/custom/v1/khainiem-contents';
        
        document.getElementById('api-endpoint').textContent = apiUrl;

        async function testAPI(url, name) {
            const resultsDiv = document.getElementById('test-results');
            
            try {
                resultsDiv.innerHTML += `<div class="test-section info"><h4>🔄 Testing ${name}</h4><p><strong>URL:</strong> ${url}</p></div>`;
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                resultsDiv.innerHTML += `<div class="test-section success">
                    <h4>✅ ${name} - Success</h4>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Data:</strong> ${data.data ? 'Received data' : 'No data'}</p>
                    <p><strong>Posts count:</strong> ${data.data?.contents?.nodes?.length || 0}</p>
                </div>`;
                
            } catch (error) {
                resultsDiv.innerHTML += `<div class="test-section error">
                    <h4>❌ ${name} - Failed</h4>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <pre>${error.stack}</pre>
                </div>`;
            }
        }

        function testDirectAPI() {
            testAPI('https://admin.wikiw.vn/wp-json/custom/v1/khainiem-contents', 'Direct API');
        }

        function testProxyAPI() {
            testAPI('/.netlify/functions/khainiem-proxy', 'Proxy API');
        }

        function testAutoAPI() {
            testAPI(apiUrl, 'Auto Detection');
        }
    </script>
</body>
</html>
