[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.100.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

# Dev server configuration for netlify dev
[dev]
  command = "hugo server -D --disableFastRender --bind 0.0.0.0 --baseURL http://localhost:8888"
  port = 8888
  targetPort = 1313
  publish = "public"
  autoLaunch = false
  
# Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Sitemap
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# RSS Feed
[[redirects]]
  from = "/index.xml"
  to = "/index.xml"
  status = 200