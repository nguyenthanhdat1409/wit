<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Authentication - HappyMarketDocs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">🧪 Test Authentication System</h1>
            
            <!-- Test Results -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4">📊 Test Results</h2>
                <div id="testResults" class="space-y-4">
                    <div class="text-gray-500">Chưa có kết quả test...</div>
                </div>
            </div>
            
            <!-- Manual Tests -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- WordPress API Test -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h3 class="text-lg font-semibold mb-4">🔗 WordPress API Test</h3>
                    <div class="space-y-4">
                        <button onclick="testWordPressAPI()" class="w-full bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">
                            Test WordPress REST API
                        </button>
                        <button onclick="testJWTEndpoint()" class="w-full bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg">
                            Test JWT Endpoint
                        </button>
                        <button onclick="testUserRegistration()" class="w-full bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg">
                            Test User Registration
                        </button>
                    </div>
                </div>
                
                <!-- Netlify Function Test -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h3 class="text-lg font-semibold mb-4">⚡ Netlify Function Test</h3>
                    <div class="space-y-4">
                        <button onclick="testNetlifyFunction()" class="w-full bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg">
                            Test Netlify Function
                        </button>
                        <button onclick="testAuthFlow()" class="w-full bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                            Test Full Auth Flow
                        </button>
                        <button onclick="clearResults()" class="w-full bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg">
                            Clear Results
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Test Credentials -->
            <div class="bg-white rounded-lg shadow-lg p-6 mt-6">
                <h3 class="text-lg font-semibold mb-4">🔑 Test Credentials</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email/Username:</label>
                        <input type="text" id="testEmail" value="test@example.com" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password:</label>
                        <input type="password" id="testPassword" value="password123" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WORDPRESS_URL = 'https://admin.wikiw.vn';
        const NETLIFY_FUNCTION_URL = '/.netlify/functions/auth';
        
        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('testResults');
            const resultDiv = document.createElement('div');
            
            const colors = {
                success: 'bg-green-100 border-green-300 text-green-800',
                error: 'bg-red-100 border-red-300 text-red-800',
                warning: 'bg-yellow-100 border-yellow-300 text-yellow-800',
                info: 'bg-blue-100 border-blue-300 text-blue-800'
            };
            
            resultDiv.className = `p-3 rounded-lg border ${colors[type]}`;
            resultDiv.innerHTML = `
                <div class="flex items-center justify-between">
                    <span>${message}</span>
                    <span class="text-xs text-gray-500">${new Date().toLocaleTimeString()}</span>
                </div>
            `;
            
            resultsDiv.appendChild(resultDiv);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('testResults').innerHTML = '<div class="text-gray-500">Đã xóa kết quả test...</div>';
        }
        
        async function testWordPressAPI() {
            addResult('🔄 Testing WordPress REST API...', 'info');
            
            try {
                const response = await fetch(`${WORDPRESS_URL}/wp-json/wp/v2/`);
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ WordPress API hoạt động bình thường. Version: ${data.version}`, 'success');
                } else {
                    addResult(`❌ WordPress API lỗi: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Lỗi kết nối WordPress API: ${error.message}`, 'error');
            }
        }
        
        async function testJWTEndpoint() {
            addResult('🔄 Testing JWT Authentication endpoint...', 'info');
            
            try {
                const response = await fetch(`${WORDPRESS_URL}/wp-json/jwt-auth/v1/token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'test',
                        password: 'test'
                    })
                });
                
                if (response.ok) {
                    addResult('✅ JWT endpoint hoạt động bình thường', 'success');
                } else if (response.status === 401) {
                    addResult('⚠️ JWT endpoint hoạt động nhưng credentials không đúng', 'warning');
                } else {
                    addResult(`❌ JWT endpoint lỗi: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Lỗi kết nối JWT endpoint: ${error.message}`, 'error');
            }
        }
        
        async function testUserRegistration() {
            addResult('🔄 Testing user registration...', 'info');
            
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            try {
                const response = await fetch(`${WORDPRESS_URL}/wp-json/wp/v2/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: email,
                        email: email,
                        password: password,
                        name: 'Test User'
                    })
                });
                
                if (response.ok) {
                    addResult('✅ User registration hoạt động bình thường', 'success');
                } else if (response.status === 400) {
                    const errorData = await response.json();
                    addResult(`⚠️ User registration: ${errorData.message}`, 'warning');
                } else {
                    addResult(`❌ User registration lỗi: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Lỗi user registration: ${error.message}`, 'error');
            }
        }
        
        async function testNetlifyFunction() {
            addResult('🔄 Testing Netlify Function...', 'info');
            
            try {
                const response = await fetch(NETLIFY_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'login',
                        username: 'test',
                        password: 'test'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        addResult('✅ Netlify Function hoạt động bình thường', 'success');
                    } else {
                        addResult(`⚠️ Netlify Function: ${data.message}`, 'warning');
                    }
                } else {
                    addResult(`❌ Netlify Function lỗi: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Lỗi Netlify Function: ${error.message}`, 'error');
            }
        }
        
        async function testAuthFlow() {
            addResult('🔄 Testing complete authentication flow...', 'info');
            
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            try {
                // Test registration
                addResult('📝 Step 1: Testing registration...', 'info');
                const registerResponse = await fetch(NETLIFY_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'register',
                        username: email,
                        email: email,
                        password: password,
                        name: 'Test User'
                    })
                });
                
                const registerData = await registerResponse.json();
                
                if (registerData.success) {
                    addResult('✅ Registration successful', 'success');
                    
                    // Test login
                    addResult('🔐 Step 2: Testing login...', 'info');
                    const loginResponse = await fetch(NETLIFY_FUNCTION_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            action: 'login',
                            username: email,
                            password: password
                        })
                    });
                    
                    const loginData = await loginResponse.json();
                    
                    if (loginData.success) {
                        addResult('✅ Login successful', 'success');
                        
                        // Test user data
                        addResult('👤 Step 3: Testing user data...', 'info');
                        const userResponse = await fetch(NETLIFY_FUNCTION_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                action: 'user',
                                token: loginData.token
                            })
                        });
                        
                        const userData = await userResponse.json();
                        
                        if (userData.success) {
                            addResult('✅ User data retrieval successful', 'success');
                            addResult('🎉 Complete authentication flow working!', 'success');
                        } else {
                            addResult(`❌ User data retrieval failed: ${userData.message}`, 'error');
                        }
                    } else {
                        addResult(`❌ Login failed: ${loginData.message}`, 'error');
                    }
                } else {
                    addResult(`❌ Registration failed: ${registerData.message}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Auth flow error: ${error.message}`, 'error');
            }
        }
        
        // Auto-run basic tests on page load
        window.addEventListener('load', function() {
            addResult('🚀 Authentication test page loaded', 'info');
            addResult('💡 Click buttons above to run tests', 'info');
        });
    </script>
</body>
</html>
