{{ define "main" }}
<div class="min-h-screen bg-white">
    <!-- Content Section -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        {{ .Content }}
    </div>
</div>

<style>
.hequychieu-posts {
    margin-top: 2rem;
}

.hequychieu-meta {
    color: #64748b;
    font-size: 0.9375rem;
    margin-bottom: 2rem;
    text-align: center;
    padding: 1.5rem;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(250, 245, 255, 0.9) 100%);
    border-radius: 12px;
    border: 1px solid rgba(216, 180, 254, 0.3);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 6px -1px rgba(147, 51, 234, 0.1);
}

.image-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 0 8px;
  max-width: 100%;
}

 .image-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between; /* đẩy nút xuống cuối */
  height: 100%; /* card cao bằng nhau */
  border: 1px solid #fff; /* đổi viền trắng */
  border-radius: 8px;
  padding: 12px;
  background: #fff;
  text-align: center;
  min-height: 320px; /* Đảm bảo chiều cao tối thiểu */
}

.image-card img {
  width: 100%;
  height: 200px;
  object-fit: contain;
  border-radius: 4px;
  border: 1px solid #fff;
  padding: 10px;
  display: block;
  margin: 0 auto;
}

.image-card p {
  min-height: 60px; /* tăng chiều cao để chứa 2 dòng */
  max-height: 60px; /* giới hạn chiều cao */
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 12px 0;
  font-size: 15px;
  color: #333;
  font-weight: 500;
  line-height: 1.3; /* giảm line-height để fit 2 dòng */
  overflow: hidden; /* ẩn text dài */
  text-overflow: ellipsis; /* hiển thị ... nếu text quá dài */
  padding: 0 8px; /* padding ngang để tránh text sát viền */
}

.image-card .buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 12px;
  flex-direction: row;
}

.image-card .buttons a {
  background: #007bff;
  color: #fff;
  padding: 5px;
  border-radius: 6px;
  font-size: 14px;
  text-decoration: none;
  flex: 1;
  max-width: 120px;
  text-align: center;
  font-weight: 500;
}

.image-card .buttons a:last-child {
  background: #28a745;
}

.hequychieu-error {
    text-align: center;
    padding: 2rem;
    color: #dc2626;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
}

.hequychieu-error p {
    margin-bottom: 0.5rem;
}


.loading {
    text-align: center;
    padding: 2rem;
    color: #6b7280;
}

/* HeQuyChieu Iframe Modal Styles */
.hequychieu-iframe-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(88, 28, 135, 0.8);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease;
}

.hequychieu-iframe-content {
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(147, 51, 234, 0.3);
    max-width: 98vw;
    max-height: 98vh;
    width: 1200px;
    height: 800px;
    min-width: 900px;
    min-height: 700px;
    overflow: hidden;
    animation: slideIn 0.3s ease;
}

.hequychieu-iframe-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #e5e7eb;
    background: linear-gradient(135deg, #9333ea, #7e22ce);
    color: white;
}

.hequychieu-iframe-header h3 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    flex: 1;
    margin-right: 1rem;
}

.hequychieu-iframe-close {
    background: none;
    border: none;
    font-size: 1.5rem;
    color: white;
    cursor: pointer;
    padding: 0.25rem;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background-color 0.2s;
}

.hequychieu-iframe-close:hover {
    background-color: rgba(255, 255, 255, 0.2);
}

.hequychieu-iframe-body {
    height: calc(100% - 60px);
    padding: 0;
    overflow: hidden;
}

.hequychieu-iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideIn {
    from { 
        opacity: 0;
        transform: scale(0.9) translateY(-20px);
    }
    to { 
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* Tablet - 2 cột */
@media (min-width: 768px) {
  .image-grid {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 12px;
  }
  
  .image-card {
    flex: 1 1 calc(50% - 6px);
    max-width: calc(50% - 6px);
  }
}

/* Desktop - 3 cột */
@media (min-width: 1024px) {
  .image-card {
    flex: 1 1 calc(33.333% - 8px);
    max-width: calc(33.333% - 8px);
  }
}

/* Large Desktop - 4 cột */
@media (min-width: 1200px) {
  .image-card {
    flex: 1 1 calc(25% - 9px);
    max-width: calc(25% - 9px);
  }
}

/* Extra small mobile */
@media (max-width: 480px) {
  .image-grid {
    padding: 0 4px;
    gap: 12px;
  }
  
  .image-card {
    padding: 10px;
    min-height: 300px; /* Giảm chiều cao tối thiểu cho mobile */
  }
  
  .image-card img {
    height: 180px;
    padding: 8px;
  }
  
  .image-card p {
    font-size: 15px;
    margin: 10px 0;
    min-height: 50px; /* Giảm chiều cao title cho mobile */
    max-height: 50px;
  }
  
  .image-card .buttons {
    gap: 10px;
    margin-top: 10px;
  }
  
  .image-card .buttons a {
    padding: 8px 16px;
    font-size: 13px;
    max-width: 100px;
  }
}
    
    .hequychieu-iframe-content {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border-radius: 0;
        min-width: 100vw;
        min-height: 100vh;
    }
    
    .hequychieu-iframe-body {
        height: calc(100vh - 60px);
        position: relative;
    }
    
    .hequychieu-iframe-body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: white;
        z-index: 1000;
        pointer-events: none;
    }
    
    .hequychieu-iframe {
        transform: translateY(0);
        height: 100%;
    }
}

.wordpress-header-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 0;
    background: white;
    z-index: 1000;
    pointer-events: none;
    display: none;
}

@media (max-width: 480px) {
    .hequychieu-iframe {
        transform: translateY(0);
    }
    
    .hequychieu-iframe-body::before {
        height: 0;
    }
}
</style>
{{ end }}
