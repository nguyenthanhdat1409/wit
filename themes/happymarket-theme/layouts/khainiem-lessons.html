{{ define "main" }}
<div class="min-h-screen bg-gray-50">
    <!-- Content Section -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{ .Content }}
    </div>
</div>

<style>
.khainiem-posts {
    margin-top: 2rem;
}

.khainiem-meta {
    color: #6b7280;
    font-size: 0.875rem;
    margin-bottom: 1.5rem;
    text-align: center;
    padding: 1rem;
    background: #f9fafb;
    border-radius: 8px;
}

.khainiem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
    width: 100%;
    align-items: start;
}

.khainiem-card {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 1.5rem;
    transition: all 0.2s ease;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    height: 280px;
    position: relative;
    overflow: hidden;
}

.khainiem-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px -1px rgba(236, 72, 153, 0.2);
    border-color: #ec4899;
}

.khainiem-title {
    font-size: 1.125rem;
    font-weight: 600;
    color: #ec4899 !important;
    margin: 0 0 1rem 0;
    line-height: 1.4;
}

.khainiem-excerpt {
    color: #6b7280;
    font-size: 0.875rem;
    line-height: 1.5;
    margin-bottom: 1rem;
    flex-grow: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    max-height: 60px;
}

.khainiem-link {
    display: inline-flex;
    align-items: center;
    background: #ec4899;
    color: white;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: auto;
    align-self: flex-start;
    flex-shrink: 0;
}

.khainiem-link:hover {
    background: #db2777;
    transform: translateY(-1px);
    box-shadow: 0 2px 4px rgba(236, 72, 153, 0.3);
}

.khainiem-error {
    text-align: center;
    padding: 2rem;
    color: #dc2626;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
}

.khainiem-error p {
    margin-bottom: 0.5rem;
}

.loading {
    text-align: center;
    padding: 2rem;
    color: #6b7280;
}

/* Khainiem Iframe Modal Styles */
.khainiem-iframe-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease;
}

.khainiem-iframe-content {
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    max-width: 95vw;
    max-height: 95vh;
    width: 1000px;
    height: 700px;
    min-width: 800px;
    min-height: 600px;
    overflow: hidden;
    animation: slideIn 0.3s ease;
}

.khainiem-iframe-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #e5e7eb;
    background: linear-gradient(135deg, #ec4899, #db2777);
    color: white;
}

.khainiem-iframe-header h3 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    flex: 1;
    margin-right: 1rem;
}

.khainiem-iframe-close {
    background: none;
    border: none;
    font-size: 1.5rem;
    color: white;
    cursor: pointer;
    padding: 0.25rem;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background-color 0.2s;
}

.khainiem-iframe-close:hover {
    background-color: rgba(255, 255, 255, 0.2);
}

.khainiem-iframe-body {
    height: calc(100% - 60px);
    padding: 0;
    overflow: hidden;
}

    .khainiem-iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    
    /* Reset body và html trong iframe */
    html, body {
        margin: 0 !important;
        padding: 0 !important;
        overflow-x: hidden !important;
    }
    /* Ẩn admin bar nếu nó vẫn hiển thị */
    #wpadminbar {
        display: none !important;
    }
    /* Reset các container chính của nội dung WordPress */
    .gt-main, .gt-page-wrapper, .gt-article {
        margin-top: 0px !important;
        padding-top: 0px !important;
    }
    /* Điều chỉnh tiêu đề bài học */
    .gt-post-header {
        margin-top: 0px !important;
        padding-top: 20px !important;
    }
    .gt-post-header h1, h1.entry-title, .wp-block-post-title {
        margin-top: 0px !important;
        padding-top: 0px !important;
        line-height: 1.2 !important;
        font-size: 2.25rem !important;
    }
    /* Đảm bảo nội dung chính không bị che */
    .gt-content-body {
        margin-top: 20px !important;
    }

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideIn {
    from { 
        opacity: 0;
        transform: scale(0.9) translateY(-20px);
    }
    to { 
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* Mobile responsive */
@media (max-width: 768px) {
    .khainiem-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-top: 1rem;
    }
    
    .khainiem-card {
        padding: 1rem;
        width: 100%;
    }
    
    .khainiem-iframe-content {
        width: 98vw;
        height: 95vh;
        margin: 1vh;
    }
    
    .khainiem-iframe-header {
        padding: 0.75rem 1rem;
    }
    
    .khainiem-iframe-header h3 {
        font-size: 1rem;
    }
    
    .khainiem-iframe-body {
        height: calc(95vh - 60px);
    }
}

/* Tablet responsive */
@media (max-width: 1024px) {
    .khainiem-iframe-content {
        width: 90vw;
        height: 80vh;
        min-width: 600px;
        min-height: 500px;
    }
}

@media (max-width: 768px) {
    .khainiem-iframe-content {
        width: 95vw;
        height: 85vh;
        min-width: 320px;
        min-height: 400px;
        margin: 0;
        border-radius: 8px;
    }
    
    .khainiem-iframe-body {
        height: calc(100% - 60px);
    }
    
    .khainiem-iframe-header h3 {
        font-size: 1rem;
    }
}

@media (max-width: 768px) {
    .khainiem-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
    }
    
    .khainiem-card {
        height: 260px;
        padding: 1rem;
    }
    
    .khainiem-title {
        font-size: 1rem;
    }
    
    .khainiem-excerpt {
        -webkit-line-clamp: 2;
        max-height: 40px;
    }
}

@media (max-width: 480px) {
    .khainiem-iframe-content {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border-radius: 0;
        min-width: 100vw;
        min-height: 100vh;
    }
    
    .khainiem-iframe-body {
        height: calc(100vh - 60px);
        position: relative;
    }
    
    .khainiem-iframe-body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: white;
        z-index: 1000;
        pointer-events: none;
    }
    
    .khainiem-iframe {
        transform: translateY(0);
        height: 100%;
    }
    
    .wordpress-header-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: white;
        z-index: 1000;
        pointer-events: none;
    }
    
    .khainiem-iframe {
    }
    
    @media (max-width: 480px) {
        .khainiem-iframe {
            transform: translateY(0);
        }
        
        .khainiem-iframe-body::before {
            height: 0;
        }
        
        .wordpress-header-overlay {
            height: 0;
        }
    }
    
    .khainiem-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
    }
    
    .khainiem-card {
        height: 240px;
        padding: 1rem;
    }
}
</style>
{{ end }}
