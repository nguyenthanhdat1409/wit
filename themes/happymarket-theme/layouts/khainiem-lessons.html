{{ define "main" }}
<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100">
    <!-- Content Section -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        {{ .Content }}
    </div>
</div>

<style>
.khainiem-posts {
    margin-top: 2rem;
}

.khainiem-meta {
    color: #64748b;
    font-size: 0.9375rem;
    margin-bottom: 2rem;
    text-align: center;
    padding: 1.5rem;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 250, 252, 0.9) 100%);
    border-radius: 12px;
    border: 1px solid rgba(226, 232, 240, 0.5);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.khainiem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
    width: 100%;
    align-items: start;
}

/* Responsive breakpoints */
@media (max-width: 1200px) {
    .khainiem-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.25rem;
    }
}

@media (max-width: 992px) {
    .khainiem-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
    }
}

.khainiem-card {
    background: linear-gradient(145deg, #ffffff 0%, #f8fafc 50%, #ffffff 100%);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 1.75rem;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    height: 300px;
    position: relative;
    overflow: hidden;
    box-shadow: 
        0 10px 15px -3px rgba(0, 0, 0, 0.1), 
        0 4px 6px -2px rgba(0, 0, 0, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
}

.khainiem-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 
        0 25px 50px -12px rgba(236, 72, 153, 0.25), 
        0 0 0 1px rgba(236, 72, 153, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    border-color: #ec4899;
    background: linear-gradient(145deg, #ffffff 0%, #fef7ff 50%, #ffffff 100%);
}

.khainiem-title {
    font-size: 1.375rem !important;
    font-weight: 700;
    color: #1e293b !important;
    margin: 0 0 1.25rem 0;
    line-height: 1.3;
    background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.khainiem-excerpt {
    color: #64748b;
    font-size: 0.9375rem !important;
    line-height: 1.6;
    margin-bottom: 1.5rem;
    flex-grow: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    max-height: 80px;
    font-weight: 400;
}

.khainiem-link {
    display: inline-flex;
    align-items: center;
    background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.8125rem !important;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: auto;
    align-self: flex-start;
    flex-shrink: 0;
    box-shadow: 0 4px 6px -1px rgba(236, 72, 153, 0.3);
}

.khainiem-link:hover {
    background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 15px -3px rgba(236, 72, 153, 0.4);
}

.khainiem-error {
    text-align: center;
    padding: 2rem;
    color: #dc2626;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
}

.khainiem-error p {
    margin-bottom: 0.5rem;
}

.loading {
    text-align: center;
    padding: 2rem;
    color: #6b7280;
}

/* Khainiem Iframe Modal Styles */
.khainiem-iframe-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease;
}

.khainiem-iframe-content {
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    max-width: 95vw;
    max-height: 95vh;
    width: 1000px;
    height: 700px;
    min-width: 800px;
    min-height: 600px;
    overflow: hidden;
    animation: slideIn 0.3s ease;
}

.khainiem-iframe-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #e5e7eb;
    background: linear-gradient(135deg, #ec4899, #db2777);
    color: white;
}

.khainiem-iframe-header h3 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    flex: 1;
    margin-right: 1rem;
}

.khainiem-iframe-close {
    background: none;
    border: none;
    font-size: 1.5rem;
    color: white;
    cursor: pointer;
    padding: 0.25rem;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background-color 0.2s;
}

.khainiem-iframe-close:hover {
    background-color: rgba(255, 255, 255, 0.2);
}

.khainiem-iframe-body {
    height: calc(100% - 60px);
    padding: 0;
    overflow: hidden;
}

    .khainiem-iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    
    /* Reset body và html trong iframe */
    html, body {
        margin: 0 !important;
        padding: 0 !important;
        overflow-x: hidden !important;
    }
    /* Ẩn admin bar nếu nó vẫn hiển thị */
    #wpadminbar {
        display: none !important;
    }
    /* Reset các container chính của nội dung WordPress */
    .gt-main, .gt-page-wrapper, .gt-article {
        margin-top: 0px !important;
        padding-top: 0px !important;
    }
    /* Điều chỉnh tiêu đề bài học */
    .gt-post-header {
        margin-top: 0px !important;
        padding-top: 20px !important;
    }
    .gt-post-header h1, h1.entry-title, .wp-block-post-title {
        margin-top: 0px !important;
        padding-top: 0px !important;
        line-height: 1.2 !important;
        font-size: 2.25rem !important;
    }
    /* Đảm bảo nội dung chính không bị che */
    .gt-content-body {
        margin-top: 20px !important;
    }

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideIn {
    from { 
        opacity: 0;
        transform: scale(0.9) translateY(-20px);
    }
    to { 
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* Mobile responsive */
@media (max-width: 768px) {
    .khainiem-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-top: 1rem;
    }
    
    .khainiem-card {
        padding: 1rem;
        width: 100%;
    }
    
    .khainiem-iframe-content {
        width: 98vw;
        height: 95vh;
        margin: 1vh;
    }
    
    .khainiem-iframe-header {
        padding: 0.75rem 1rem;
    }
    
    .khainiem-iframe-header h3 {
        font-size: 1rem;
    }
    
    .khainiem-iframe-body {
        height: calc(95vh - 60px);
    }
}

/* Tablet responsive */
@media (max-width: 1024px) {
    .khainiem-iframe-content {
        width: 90vw;
        height: 80vh;
        min-width: 600px;
        min-height: 500px;
    }
}

@media (max-width: 768px) {
    .khainiem-iframe-content {
        width: 95vw;
        height: 85vh;
        min-width: 320px;
        min-height: 400px;
        margin: 0;
        border-radius: 8px;
    }
    
    .khainiem-iframe-body {
        height: calc(100% - 60px);
    }
    
    .khainiem-iframe-header h3 {
        font-size: 1rem;
    }
}

@media (max-width: 768px) {
    .khainiem-grid {
        grid-template-columns: 1fr;
        gap: 1.25rem;
        margin-top: 1.5rem;
    }
    
    .khainiem-card {
        height: auto;
        min-height: 280px;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.1);
    }
    
    .khainiem-title {
        font-size: 1.25rem !important;
        line-height: 1.3;
        margin-bottom: 1rem;
    }
    
    .khainiem-excerpt {
        font-size: 0.875rem !important;
        -webkit-line-clamp: 4;
        max-height: 70px;
        line-height: 1.5;
        margin-bottom: 1.25rem;
    }
    
    .khainiem-link {
        font-size: 0.8125rem !important;
        padding: 0.5rem 1rem;
        margin-top: auto;
    }
}

@media (max-width: 480px) {
    .khainiem-iframe-content {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border-radius: 0;
        min-width: 100vw;
        min-height: 100vh;
    }
    
    .khainiem-iframe-body {
        height: calc(100vh - 60px);
        position: relative;
    }
    
    .khainiem-iframe-body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: white;
        z-index: 1000;
        pointer-events: none;
    }
    
    .khainiem-iframe {
        transform: translateY(0);
        height: 100%;
    }
    
    .wordpress-header-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: white;
        z-index: 1000;
        pointer-events: none;
        display: none; /* Ẩn mặc định trên desktop */
    }
    
    .khainiem-iframe {
    }
    
    @media (max-width: 480px) {
        .khainiem-iframe {
            transform: translateY(0);
        }
        
        .khainiem-iframe-body::before {
            height: 0;
        }
        
        .wordpress-header-overlay {
            height: 0;
            display: none; /* Ẩn trên mobile khi không cần */
        }
    }
    
    .khainiem-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-top: 1.25rem;
    }
    
    .khainiem-card {
        height: auto;
        min-height: 260px;
        padding: 1.25rem;
        border-radius: 10px;
        box-shadow: 0 4px 8px -2px rgba(0, 0, 0, 0.1);
    }
    
    .khainiem-title {
        font-size: 1.125rem !important;
        margin-bottom: 0.875rem;
        line-height: 1.3;
    }
    
    .khainiem-excerpt {
        font-size: 0.8125rem !important;
        -webkit-line-clamp: 3;
        max-height: 48px;
        margin-bottom: 1rem;
        line-height: 1.4;
    }
    
    .khainiem-link {
        font-size: 0.75rem !important;
        padding: 0.4375rem 0.875rem;
        margin-top: auto;
    }
}
</style>
{{ end }}
