<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordPress API Test - HappyMarketDocs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="glassmorphism rounded-2xl p-6 mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">WordPress API Test</h1>
            <p class="text-white/80">Test kết nối với WordPress API</p>
        </div>

        <!-- Configuration -->
        <div class="glassmorphism rounded-2xl p-6 mb-8">
            <h2 class="text-xl font-bold text-white mb-4">Cấu hình WordPress</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">WordPress URL</label>
                    <input 
                        type="url" 
                        id="wordpressUrl" 
                        value="https://wit.convoi.com.vn"
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">Endpoint</label>
                    <select id="endpoint" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="posts">Posts</option>
                        <option value="pages">Pages</option>
                        <option value="categories">Categories</option>
                        <option value="tags">Tags</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">Username (tùy chọn)</label>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="admin hoặc email"
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">Password (tùy chọn)</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Application Password"
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
            </div>
            
            <div class="flex space-x-4 mt-6">
                <button onclick="testConnection()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-medium transition-all">
                    Test Connection
                </button>
                <button onclick="fetchData()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg font-medium transition-all">
                    Lấy Dữ Liệu
                </button>
            </div>
        </div>

        <!-- Results -->
        <div class="glassmorphism rounded-2xl p-6">
            <h2 class="text-xl font-bold text-white mb-4">Kết Quả</h2>
            
            <div id="loading" class="hidden text-center py-8">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mx-auto mb-4"></div>
                <p class="text-white/80">Đang xử lý...</p>
            </div>
            
            <div id="error" class="hidden bg-red-500/20 border border-red-500/50 rounded-lg p-4 mb-4">
                <div class="flex items-center">
                    <span class="text-red-200" id="errorText"></span>
                </div>
            </div>
            
            <div id="success" class="hidden bg-green-500/20 border border-green-500/50 rounded-lg p-4 mb-4">
                <div class="flex items-center">
                    <span class="text-green-200" id="successText"></span>
                </div>
            </div>
            
            <div id="results" class="space-y-4">
                <div class="text-center py-8 text-white/60">
                    <p>Nhập thông tin và test connection để bắt đầu</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentData = null;

        async function testConnection() {
            const config = getConfig();
            showLoading();
            hideMessages();

            try {
                const response = await fetch('http://localhost:3001/api/wordpress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ...config,
                        params: { per_page: 1 }
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showSuccess(`✅ Kết nối thành công! Tìm thấy ${result.total} ${config.endpoint} (${result.auth})`);
                } else {
                    showError(`❌ Lỗi: ${result.message}`);
                }
            } catch (error) {
                showError(`❌ Lỗi kết nối: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        async function fetchData() {
            const config = getConfig();
            showLoading();
            hideMessages();

            try {
                const response = await fetch('http://localhost:3001/api/wordpress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ...config,
                        params: { per_page: 10 }
                    })
                });

                const result = await response.json();

                if (result.success) {
                    currentData = result.data;
                    displayResults(result.data);
                    showSuccess(`✅ Đã lấy được ${result.data.length} ${config.endpoint} từ WordPress`);
                } else {
                    showError(`❌ Lỗi: ${result.message}`);
                }
            } catch (error) {
                showError(`❌ Lỗi: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        function getConfig() {
            return {
                wordpressUrl: document.getElementById('wordpressUrl').value,
                endpoint: document.getElementById('endpoint').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
        }

        function displayResults(data) {
            const container = document.getElementById('results');
            
            if (data.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-white/60">Không tìm thấy dữ liệu</div>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="bg-white/10 rounded-lg p-4 border border-white/20">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="text-white font-semibold text-lg">${item.title}</h3>
                        <span class="bg-blue-500/20 text-blue-200 px-2 py-1 rounded text-sm">
                            ${item.status}
                        </span>
                    </div>
                    
                    <div class="text-white/80 text-sm mb-3">
                        <p class="line-clamp-2">${item.excerpt.substring(0, 200)}...</p>
                    </div>
                    
                    <div class="flex items-center justify-between text-xs text-white/60">
                        <div class="flex items-center space-x-4">
                            <span>📅 ${new Date(item.date).toLocaleDateString('vi-VN')}</span>
                            <span>👤 Author ${item.author}</span>
                            <span>📝 ${item.wordCount} từ</span>
                        </div>
                        <div class="flex space-x-2">
                            ${item.hasImages ? '<span class="bg-green-500/20 text-green-200 px-1 rounded">📷</span>' : ''}
                            ${item.hasLinks ? '<span class="bg-blue-500/20 text-blue-200 px-1 rounded">🔗</span>' : ''}
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <button onclick="viewContent(${item.id})" class="bg-blue-500/20 hover:bg-blue-500/30 text-blue-200 px-3 py-1 rounded text-sm transition-all">
                            👁️ Xem Content
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function viewContent(itemId) {
            const item = currentData.find(d => d.id === itemId);
            if (!item) return;

            alert(`Content Preview:\n\n${item.wikiContent.substring(0, 500)}...`);
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('error').classList.remove('hidden');
        }

        function showSuccess(message) {
            document.getElementById('successText').textContent = message;
            document.getElementById('success').classList.remove('hidden');
        }

        function hideMessages() {
            document.getElementById('error').classList.add('hidden');
            document.getElementById('success').classList.add('hidden');
        }
    </script>
</body>
</html>
