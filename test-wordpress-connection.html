<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WordPress Connection - HappyMarketDocs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">🔗 Test WordPress Connection</h1>
            
            <!-- Configuration -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4">⚙️ Configuration</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">WordPress URL</label>
                        <input type="text" id="wordpressUrl" value="https://admin.wikiw.vn" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Test Username</label>
                        <input type="text" id="testUsername" placeholder="Enter test username" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                    </div>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Test Password</label>
                    <input type="password" id="testPassword" placeholder="Enter test password" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                </div>
            </div>
            
            <!-- Test Buttons -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4">🧪 Test Functions</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <button onclick="testBasicAPI()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium">
                        Test Basic API
                    </button>
                    <button onclick="testJWTLogin()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium">
                        Test JWT Login
                    </button>
                    <button onclick="testUserRegistration()" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg font-medium">
                        Test Registration
                    </button>
                    <button onclick="testAll()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-medium">
                        Test All
                    </button>
                </div>
            </div>
            
            <!-- Results -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4">📊 Test Results</h2>
                <div id="testResults" class="space-y-4">
                    <p class="text-gray-500">Click a test button to see results...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentToken = null;
        
        function getWordPressUrl() {
            return document.getElementById('wordpressUrl').value;
        }
        
        function getTestCredentials() {
            return {
                username: document.getElementById('testUsername').value,
                password: document.getElementById('testPassword').value
            };
        }
        
        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('testResults');
            const timestamp = new Date().toLocaleTimeString();
            
            const colors = {
                success: 'bg-green-100 border-green-300 text-green-800',
                error: 'bg-red-100 border-red-300 text-red-800',
                warning: 'bg-yellow-100 border-yellow-300 text-yellow-800',
                info: 'bg-blue-100 border-blue-300 text-blue-800'
            };
            
            const resultDiv = document.createElement('div');
            resultDiv.className = `p-4 rounded-lg border ${colors[type]}`;
            resultDiv.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="font-medium">${message}</span>
                    <span class="text-sm opacity-75">${timestamp}</span>
                </div>
            `;
            
            resultsDiv.appendChild(resultDiv);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('testResults').innerHTML = '';
        }
        
        async function testBasicAPI() {
            clearResults();
            addResult('🔄 Testing WordPress REST API...', 'info');
            
            try {
                const response = await fetch(`${getWordPressUrl()}/wp-json/wp/v2/`);
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ REST API Working! Site: ${data.name}`, 'success');
                    addResult(`📝 Description: ${data.description}`, 'info');
                    addResult(`🔗 API URL: ${data.url}`, 'info');
                } else {
                    addResult(`❌ REST API Failed: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        async function testJWTLogin() {
            clearResults();
            const credentials = getTestCredentials();
            
            if (!credentials.username || !credentials.password) {
                addResult('⚠️ Please enter username and password', 'warning');
                return;
            }
            
            addResult('🔄 Testing JWT Authentication...', 'info');
            
            try {
                const response = await fetch(`${getWordPressUrl()}/wp-json/jwt-auth/v1/token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: credentials.username,
                        password: credentials.password
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentToken = data.token;
                    
                    addResult(`✅ JWT Login Successful!`, 'success');
                    addResult(`👤 User: ${data.user_display_name}`, 'info');
                    addResult(`📧 Email: ${data.user_email}`, 'info');
                    addResult(`🔑 Token: ${data.token.substring(0, 20)}...`, 'info');
                    
                    // Test protected endpoint
                    await testProtectedEndpoint();
                } else {
                    const errorData = await response.json();
                    addResult(`❌ JWT Login Failed: ${errorData.message || response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        async function testProtectedEndpoint() {
            if (!currentToken) {
                addResult('⚠️ No token available for protected endpoint test', 'warning');
                return;
            }
            
            addResult('🔄 Testing Protected Endpoint...', 'info');
            
            try {
                const response = await fetch(`${getWordPressUrl()}/wp-json/wp/v2/users/me`, {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
                
                if (response.ok) {
                    const userData = await response.json();
                    addResult(`✅ Protected Endpoint Working!`, 'success');
                    addResult(`👤 User ID: ${userData.id}`, 'info');
                    addResult(`📝 Name: ${userData.name}`, 'info');
                    addResult(`🔗 Slug: ${userData.slug}`, 'info');
                } else {
                    addResult(`❌ Protected Endpoint Failed: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        async function testUserRegistration() {
            clearResults();
            addResult('🔄 Testing User Registration...', 'info');
            
            const testUser = {
                username: `testuser_${Date.now()}`,
                email: `test_${Date.now()}@example.com`,
                password: 'testpassword123',
                name: 'Test User'
            };
            
            try {
                const response = await fetch(`${getWordPressUrl()}/wp-json/wp/v2/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testUser)
                });
                
                if (response.ok) {
                    const userData = await response.json();
                    addResult(`✅ User Registration Successful!`, 'success');
                    addResult(`👤 User ID: ${userData.id}`, 'info');
                    addResult(`📧 Email: ${userData.email}`, 'info');
                    addResult(`🔗 Username: ${userData.slug}`, 'info');
                } else {
                    const errorData = await response.json();
                    addResult(`❌ Registration Failed: ${errorData.message || response.statusText}`, 'error');
                    
                    if (errorData.code === 'rest_user_already_exists') {
                        addResult(`💡 User already exists - this is normal for testing`, 'warning');
                    }
                }
            } catch (error) {
                addResult(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        async function testAll() {
            clearResults();
            addResult('🚀 Running All Tests...', 'info');
            
            await testBasicAPI();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testJWTLogin();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testUserRegistration();
            
            addResult('✅ All tests completed!', 'success');
        }
        
        // Auto-test basic API on page load
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(testBasicAPI, 1000);
        });
    </script>
</body>
</html>
